version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /admin-web
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    versioning-strategy: increase
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    # До выпуска 0.4.0 обычные version updates заморожены; security updates остаются активными.
    open-pull-requests-limit: 0
