version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /admin-web
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    versioning-strategy: increase

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
