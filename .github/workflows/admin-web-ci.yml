name: Проверка веб-панели

on:
  push:
    branches: [main]
  pull_request:

jobs:
  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-web/package.json

      - name: Установить зависимости
        run: npm install

      - name: Проверить TypeScript и собрать панель
        run: npm run build
