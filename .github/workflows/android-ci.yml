name: Проверка Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Собрать debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Проверить release-сборку на временном ключе
        shell: bash
        env:
          CEH_ANDROID_API_BASE_URL: https://example.invalid/
          CEH_ANDROID_VERSION_NAME: 0.0.0-ci
          CEH_ANDROID_VERSION_CODE: "1"
          CEH_ANDROID_KEYSTORE_PASSWORD: changeit-ci-only
          CEH_ANDROID_KEY_ALIAS: ci
          CEH_ANDROID_KEY_PASSWORD: changeit-ci-only
        run: |
          set -Eeuo pipefail
          keystore="$RUNNER_TEMP/ceh-sklad-ci-release.jks"
          keytool -genkeypair \
            -keystore "$keystore" \
            -storepass "$CEH_ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$CEH_ANDROID_KEY_PASSWORD" \
            -alias "$CEH_ANDROID_KEY_ALIAS" \
            -dname "CN=CI, OU=CI, O=Ceh, L=CI, ST=CI, C=RU" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -noprompt
          export CEH_ANDROID_KEYSTORE_FILE="$keystore"
          gradle :app:assembleRelease --stacktrace

          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -s "$apk"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
