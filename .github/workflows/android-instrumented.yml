name: Android инструментальные smoke-тесты

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-instrumented.yml"

permissions:
  contents: read

concurrency:
  group: android-instrumented-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Проверить последний Android commit
    runs-on: ubuntu-latest
    outputs:
      run_smoke: ${{ steps.diff.outputs.run_smoke }}
    steps:
      - name: Получить head PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Определить необходимость эмулятора
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet HEAD^ HEAD -- android .github/workflows/android-instrumented.yml; then
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: Smoke-тест на Android Emulator
    needs: changes
    if: needs.changes.outputs.run_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Получить код
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Установить Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Разрешить доступ к KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Запустить smoke-тесты на эмуляторе
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            rm -f "$GITHUB_WORKSPACE/android-smoke-failed"
            adb logcat -c || true
            gradle -p android :app:connectedDebugAndroidTest --stacktrace || touch "$GITHUB_WORKSPACE/android-smoke-failed"
            adb logcat -d > "$GITHUB_WORKSPACE/android-smoke-logcat.txt" || true
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/android-smoke-final.png" || true
            adb shell dumpsys package ru.ceh.sklad > "$GITHUB_WORKSPACE/android-smoke-package.txt" || true
            test ! -f "$GITHUB_WORKSPACE/android-smoke-failed"
      - name: Сохранить диагностику smoke-теста
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ceh-sklad-android-smoke
          path: |
            android/app/build/reports/androidTests/connected/**
            android/app/build/outputs/androidTest-results/connected/**
            android-smoke-logcat.txt
            android-smoke-final.png
            android-smoke-package.txt
          if-no-files-found: warn
          retention-days: 14
