name: Android инструментальные smoke-тесты

on:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke-тест на Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Разрешить доступ к KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Запустить smoke-тесты на эмуляторе
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle -p android :app:connectedDebugAndroidTest --stacktrace
