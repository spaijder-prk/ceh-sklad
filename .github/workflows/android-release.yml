name: Подписанный Android release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: HTTPS URL backend, например https://sklad.example.ru/
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Собрать и проверить подписанный APK
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Проверить URL и наличие release secrets
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          KEYSTORE_BASE64: ${{ secrets.CEH_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CEH_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CEH_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CEH_ANDROID_KEY_PASSWORD }}
        run: |
          python - "$API_BASE_URL" <<'PY'
          import sys
          from urllib.parse import urlparse

          value = sys.argv[1].strip().rstrip('/')
          parsed = urlparse(value)
          if parsed.scheme != 'https' or not parsed.netloc or parsed.username or parsed.password:
              raise SystemExit('api_base_url должен быть полноценным HTTPS origin без credentials')
          if parsed.path not in {'', '/'} or parsed.query or parsed.fragment:
              raise SystemExit('api_base_url не должен содержать path/query/fragment')
          PY
          test -n "$KEYSTORE_BASE64" || { echo "Не задан CEH_ANDROID_KEYSTORE_BASE64"; exit 2; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Не задан CEH_ANDROID_KEYSTORE_PASSWORD"; exit 2; }
          test -n "$KEY_ALIAS" || { echo "Не задан CEH_ANDROID_KEY_ALIAS"; exit 2; }
          test -n "$KEY_PASSWORD" || { echo "Не задан CEH_ANDROID_KEY_PASSWORD"; exit 2; }
      - name: Подготовить keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CEH_ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ceh-sklad-release.keystore"
      - name: Собрать подписанный release APK
        env:
          CEH_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ceh-sklad-release.keystore
          CEH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CEH_ANDROID_KEYSTORE_PASSWORD }}
          CEH_ANDROID_KEY_ALIAS: ${{ secrets.CEH_ANDROID_KEY_ALIAS }}
          CEH_ANDROID_KEY_PASSWORD: ${{ secrets.CEH_ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease -PCEH_API_BASE_URL="${{ inputs.api_base_url }}" --stacktrace
      - name: Проверить подпись APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - name: Сформировать release manifest
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          python scripts/android_release_manifest.py \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --metadata android/app/build/outputs/apk/release/output-metadata.json \
            --api-base-url "$API_BASE_URL" \
            --apksigner "$APKSIGNER" \
            --output "$RUNNER_TEMP/android-release-manifest.json"
      - name: Сохранить подписанный APK и manifest
        uses: actions/upload-artifact@v4
        with:
          name: ceh-sklad-release-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/android-release-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Удалить временный keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/ceh-sklad-release.keystore"
