name: Сборка подписанного Android release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "HTTPS-адрес production backend, например https://sklad.example.ru/"
        required: true
        type: string
      version_name:
        description: "Версия приложения, например 1.0.0"
        required: true
        default: "0.1.0"
        type: string
      version_code:
        description: "Положительный Android versionCode"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      CEH_ANDROID_API_BASE_URL: ${{ inputs.api_base_url }}
      CEH_ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      CEH_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      CEH_ANDROID_KEYSTORE_BASE64: ${{ secrets.CEH_ANDROID_KEYSTORE_BASE64 }}
      CEH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CEH_ANDROID_KEYSTORE_PASSWORD }}
      CEH_ANDROID_KEY_ALIAS: ${{ secrets.CEH_ANDROID_KEY_ALIAS }}
      CEH_ANDROID_KEY_PASSWORD: ${{ secrets.CEH_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Проверить параметры release
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "$CEH_ANDROID_API_BASE_URL" =~ ^https:// ]]; then
            echo "::error::api_base_url должен начинаться с https://"
            exit 2
          fi
          if [[ ! "$CEH_ANDROID_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version_code должен быть положительным целым числом"
            exit 2
          fi
          missing=0
          for name in \
            CEH_ANDROID_KEYSTORE_BASE64 \
            CEH_ANDROID_KEYSTORE_PASSWORD \
            CEH_ANDROID_KEY_ALIAS \
            CEH_ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Не задан GitHub Secret $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 2
          fi

      - name: Подготовить keystore
        shell: bash
        run: |
          set -Eeuo pipefail
          keystore="$RUNNER_TEMP/ceh-sklad-release.jks"
          printf '%s' "$CEH_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          echo "CEH_ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Собрать подписанные APK и AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Проверить подпись APK и AAB
        shell: bash
        run: |
          set -Eeuo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "Не найден apksigner в Android SDK" >&2
            exit 2
          fi
          "$apksigner" verify --verbose --print-certs "$apk"
          jarsigner -verify -verbose -certs "$aab"

          sha256sum "$apk" "$aab" | tee release-sha256.txt

      - name: Сохранить release-артефакты
        uses: actions/upload-artifact@v4
        with:
          name: ceh-sklad-android-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/release-sha256.txt
          if-no-files-found: error
          retention-days: 14
