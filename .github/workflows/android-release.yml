name: Подписанный Android release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: HTTPS URL backend, например https://sklad.example.ru/
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Собрать и опубликовать подписанный Android release
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить источник релиза и зеленый CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Подписанный release разрешен только с ветки main." >&2
            exit 2
          fi

          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "HEAD main изменился после запуска workflow. Перезапустите release с актуального main." >&2
            exit 2
          fi

          PROJECT_CI_COUNT="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "Проверка проекта" and .status == "completed" and .conclusion == "success")] | length'
          )"
          if [ "$PROJECT_CI_COUNT" -lt 1 ]; then
            echo "Для $GITHUB_SHA нет завершенного зеленого workflow «Проверка проекта»." >&2
            exit 2
          fi

      - name: Проверить локальные release-контракты
        run: |
          python -m compileall scripts/prepare_production_env.py scripts/tests
          python -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Установить Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Проверить URL и наличие release secrets
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          KEYSTORE_BASE64: ${{ secrets.CEH_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CEH_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CEH_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CEH_ANDROID_KEY_PASSWORD }}
        run: |
          python - "$API_BASE_URL" <<'PY'
          import sys
          from urllib.parse import urlparse

          value = sys.argv[1].strip().rstrip('/')
          parsed = urlparse(value)
          if parsed.scheme != 'https' or not parsed.netloc or parsed.username or parsed.password:
              raise SystemExit('api_base_url должен быть полноценным HTTPS origin без credentials')
          if parsed.path not in {'', '/'} or parsed.query or parsed.fragment:
              raise SystemExit('api_base_url не должен содержать path/query/fragment')
          PY
          test -n "$KEYSTORE_BASE64" || { echo "Не задан CEH_ANDROID_KEYSTORE_BASE64"; exit 2; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Не задан CEH_ANDROID_KEYSTORE_PASSWORD"; exit 2; }
          test -n "$KEY_ALIAS" || { echo "Не задан CEH_ANDROID_KEY_ALIAS"; exit 2; }
          test -n "$KEY_PASSWORD" || { echo "Не задан CEH_ANDROID_KEY_PASSWORD"; exit 2; }

      - name: Подготовить keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CEH_ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ceh-sklad-release.keystore"

      - name: Собрать подписанные APK и AAB
        env:
          CEH_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ceh-sklad-release.keystore
          CEH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CEH_ANDROID_KEYSTORE_PASSWORD }}
          CEH_ANDROID_KEY_ALIAS: ${{ secrets.CEH_ANDROID_KEY_ALIAS }}
          CEH_ANDROID_KEY_PASSWORD: ${{ secrets.CEH_ANDROID_KEY_PASSWORD }}
        run: >-
          gradle -p android
          :app:assembleRelease
          :app:bundleRelease
          -PCEH_API_BASE_URL="${{ inputs.api_base_url }}"
          --stacktrace

      - name: Проверить подписи
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Сформировать release manifest
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          python scripts/android_release_manifest.py \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --metadata android/app/build/outputs/apk/release/output-metadata.json \
            --api-base-url "$API_BASE_URL" \
            --apksigner "$APKSIGNER" \
            --output "$RUNNER_TEMP/android-release-manifest.json"

      - name: Подготовить постоянные файлы релиза
        id: release_meta
        run: |
          set -Eeuo pipefail
          VERSION_NAME="$(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('android/app/build/outputs/apk/release/output-metadata.json').read_text())
          print(data['elements'][0]['versionName'])
          PY
          )"
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Некорректный Android versionName: $VERSION_NAME" >&2
            exit 2
          fi

          RELEASE_TAG="android-v${VERSION_NAME}"
          RELEASE_DIR="$RUNNER_TEMP/android-release"
          mkdir -p "$RELEASE_DIR"
          cp android/app/build/outputs/apk/release/app-release.apk \
            "$RELEASE_DIR/ceh-sklad-${VERSION_NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "$RELEASE_DIR/ceh-sklad-${VERSION_NAME}.aab"
          cp "$RUNNER_TEMP/android-release-manifest.json" \
            "$RELEASE_DIR/android-release-manifest.json"
          (
            cd "$RELEASE_DIR"
            sha256sum "ceh-sklad-${VERSION_NAME}.apk" \
              "ceh-sklad-${VERSION_NAME}.aab" \
              android-release-manifest.json > SHA256SUMS.txt
          )

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_dir=$RELEASE_DIR" >> "$GITHUB_OUTPUT"

      - name: Перепроверить подготовленные файлы релиза
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          VERSION_NAME: ${{ steps.release_meta.outputs.version_name }}
          RELEASE_DIR: ${{ steps.release_meta.outputs.release_dir }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          python scripts/verify_android_release.py \
            --apk "$RELEASE_DIR/ceh-sklad-${VERSION_NAME}.apk" \
            --aab "$RELEASE_DIR/ceh-sklad-${VERSION_NAME}.aab" \
            --manifest "$RELEASE_DIR/android-release-manifest.json" \
            --checksums "$RELEASE_DIR/SHA256SUMS.txt" \
            --apksigner "$APKSIGNER" \
            --expected-api-base-url "$API_BASE_URL" \
            --expected-source-commit "$GITHUB_SHA"

      - name: Проверить уникальность версии
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG уже существует. Увеличьте Android versionName/versionCode перед новой публикацией." >&2
            exit 2
          fi

      - name: Сохранить CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ceh-sklad-release-${{ steps.release_meta.outputs.version_name }}
          path: ${{ steps.release_meta.outputs.release_dir }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Опубликовать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          VERSION_NAME: ${{ steps.release_meta.outputs.version_name }}
          RELEASE_DIR: ${{ steps.release_meta.outputs.release_dir }}
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RELEASE_DIR/ceh-sklad-${VERSION_NAME}.apk" \
            "$RELEASE_DIR/ceh-sklad-${VERSION_NAME}.aab" \
            "$RELEASE_DIR/android-release-manifest.json" \
            "$RELEASE_DIR/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Цех Склад Android ${VERSION_NAME}" \
            --notes "Подписанный Android release Цех Склад. Backend: ${API_BASE_URL}. Исходный commit: ${GITHUB_SHA}. Контрольные суммы и параметры подписи находятся в приложенных manifest/SHA256SUMS."

      - name: Удалить временный keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/ceh-sklad-release.keystore"
