name: Проверка проекта

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  backend:
    name: Проверка backend и интеграционные тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ceh_sklad_test
          POSTGRES_USER: ceh
          POSTGRES_PASSWORD: ceh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ceh -d ceh_sklad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ceh:ceh_test@localhost:5432/ceh_sklad_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: pip install -e '.[dev]'
      - name: Проверить синтаксис
        run: python -m compileall app tests alembic
      - name: Применить миграции
        run: alembic upgrade head
      - name: Выполнить интеграционные тесты
        run: pytest -q

  admin-web:
    name: Сборка панели управления
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Установить зависимости
        run: npm install
      - name: Собрать приложение
        run: npm run build

  android:
    name: Сборка Android
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Собрать debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Сохранить debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ceh-sklad-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
