name: Проверка конкурентных операций PostgreSQL

on:
  push:
    paths:
      - "backend/app/**"
      - "backend/alembic/**"
      - "backend/tests/test_postgres_concurrency.py"
      - "backend/pyproject.toml"
      - ".github/workflows/postgres-concurrency-ci.yml"
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/alembic/**"
      - "backend/tests/test_postgres_concurrency.py"
      - "backend/pyproject.toml"
      - ".github/workflows/postgres-concurrency-ci.yml"

jobs:
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ceh_load
          POSTGRES_PASSWORD: ceh_load
          POSTGRES_DB: ceh_load
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ceh_load -d ceh_load"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CEH_ENVIRONMENT: test
      CEH_DATABASE_URL: postgresql+psycopg://ceh_load:ceh_load@127.0.0.1:5432/ceh_load

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Установить backend и тестовые зависимости
        run: python -m pip install -e ".[dev]"

      - name: Применить Alembic-миграции к PostgreSQL
        run: alembic upgrade head

      - name: Проверить конкурентные списания
        run: pytest -q tests/test_postgres_concurrency.py
