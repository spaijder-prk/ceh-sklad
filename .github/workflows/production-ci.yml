name: Проверка production-контейнеров

on:
  push:
    paths:
      - "compose.production.yml"
      - ".env.production.example"
      - "backend/Dockerfile"
      - "backend/entrypoint-production.sh"
      - "backend/.dockerignore"
      - "backend/app/**"
      - "backend/alembic/**"
      - "backend/pyproject.toml"
      - "admin-web/Dockerfile"
      - "admin-web/nginx.production.conf"
      - "admin-web/.dockerignore"
      - "admin-web/src/**"
      - "admin-web/package.json"
      - "ops/**"
      - ".github/workflows/production-ci.yml"
  pull_request:
    paths:
      - "compose.production.yml"
      - ".env.production.example"
      - "backend/**"
      - "admin-web/**"
      - "ops/**"
      - ".github/workflows/production-ci.yml"

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v6

      - name: Проверить эксплуатационные скрипты
        run: |
          bash -n ops/backup-postgres.sh ops/restore-postgres.sh
          python -m py_compile ops/smoke-production.py

      - name: Подготовить тестовые секреты
        run: |
          mkdir -p /tmp/ceh-secrets
          printf '%s\n' 'ci-db-password-with-special-@-chars' > /tmp/ceh-secrets/db_password
          printf '%s\n' 'ci-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ' > /tmp/ceh-secrets/jwt_secret
          printf '%s\n' 'ci-integration-secret' > /tmp/ceh-secrets/integration_api_key
          printf '%s\n' 'ci-redis-password-with-special-@-chars' > /tmp/ceh-secrets/redis_password
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/ceh-secrets/privkey.pem \
            -out /tmp/ceh-secrets/fullchain.pem \
            -subj '/CN=localhost'

      - name: Проверить production Compose
        env:
          CEH_DB_PASSWORD_FILE: /tmp/ceh-secrets/db_password
          CEH_JWT_SECRET_FILE: /tmp/ceh-secrets/jwt_secret
          CEH_INTEGRATION_API_KEY_FILE: /tmp/ceh-secrets/integration_api_key
          CEH_REDIS_PASSWORD_FILE: /tmp/ceh-secrets/redis_password
          CEH_TLS_FULLCHAIN_FILE: /tmp/ceh-secrets/fullchain.pem
          CEH_TLS_PRIVKEY_FILE: /tmp/ceh-secrets/privkey.pem
        run: docker compose -f compose.production.yml config >/dev/null

      - name: Собрать production backend
        run: docker build -t ceh-sklad-backend:ci ./backend

      - name: Собрать production веб-панель
        run: docker build -t ceh-sklad-web:ci ./admin-web

      - name: Поднять одноразовый production-контур
        env:
          CEH_DB_PASSWORD_FILE: /tmp/ceh-secrets/db_password
          CEH_JWT_SECRET_FILE: /tmp/ceh-secrets/jwt_secret
          CEH_INTEGRATION_API_KEY_FILE: /tmp/ceh-secrets/integration_api_key
          CEH_REDIS_PASSWORD_FILE: /tmp/ceh-secrets/redis_password
          CEH_TLS_FULLCHAIN_FILE: /tmp/ceh-secrets/fullchain.pem
          CEH_TLS_PRIVKEY_FILE: /tmp/ceh-secrets/privkey.pem
          CEH_HTTP_PORT: "18080"
          CEH_HTTPS_PORT: "18443"
          CEH_PROMETHEUS_PORT: "19090"
        run: |
          docker compose -p ceh-smoke-ci -f compose.production.yml \
            up -d --build --wait db redis backend web

      - name: Проверить полный складской сценарий через HTTPS
        env:
          CEH_SMOKE_ALLOW_MUTATION: "YES"
          CEH_SMOKE_BASE_URL: https://127.0.0.1:18443
          CEH_SMOKE_INSECURE_TLS: "1"
          CEH_SMOKE_INTEGRATION_KEY: ci-integration-secret
        run: python ops/smoke-production.py

      - name: Удалить одноразовый production-контур
        if: always()
        env:
          CEH_DB_PASSWORD_FILE: /tmp/ceh-secrets/db_password
          CEH_JWT_SECRET_FILE: /tmp/ceh-secrets/jwt_secret
          CEH_INTEGRATION_API_KEY_FILE: /tmp/ceh-secrets/integration_api_key
          CEH_REDIS_PASSWORD_FILE: /tmp/ceh-secrets/redis_password
          CEH_TLS_FULLCHAIN_FILE: /tmp/ceh-secrets/fullchain.pem
          CEH_TLS_PRIVKEY_FILE: /tmp/ceh-secrets/privkey.pem
          CEH_HTTP_PORT: "18080"
          CEH_HTTPS_PORT: "18443"
          CEH_PROMETHEUS_PORT: "19090"
        run: docker compose -p ceh-smoke-ci -f compose.production.yml down -v --remove-orphans

      - name: Подготовить изолированную БД для проверки backup/restore
        env:
          CEH_COMPOSE_FILE: ops/backup-restore-ci.compose.yml
        run: |
          set -Eeuo pipefail
          touch /tmp/ceh-backup-ci.env
          docker compose -f "$CEH_COMPOSE_FILE" up -d --wait db
          docker compose -f "$CEH_COMPOSE_FILE" exec -T db psql \
            -v ON_ERROR_STOP=1 \
            -U ceh \
            -d ceh_sklad <<'SQL'
          CREATE TABLE backup_probe (
              id integer PRIMARY KEY,
              label text NOT NULL,
              amount numeric(12,3) NOT NULL
          );
          INSERT INTO backup_probe (id, label, amount) VALUES
              (1, 'первая', 10.125),
              (2, 'вторая', 2.875);
          SQL

      - name: Создать реальную резервную копию тестовой БД
        env:
          CEH_COMPOSE_FILE: ops/backup-restore-ci.compose.yml
          CEH_ENV_FILE: /tmp/ceh-backup-ci.env
          CEH_BACKUP_DIR: /tmp/ceh-backups
          CEH_BACKUP_RETENTION_DAYS: "0"
        run: |
          set -Eeuo pipefail
          ops/backup-postgres.sh
          dump_file="$(find /tmp/ceh-backups -maxdepth 1 -type f -name 'ceh_sklad_*.dump' | head -n 1)"
          test -n "$dump_file"
          test -f "${dump_file}.sha256"
          echo "CEH_CI_BACKUP_FILE=$dump_file" >> "$GITHUB_ENV"

      - name: Восстановить резервную копию в чистую БД
        env:
          CEH_COMPOSE_FILE: ops/backup-restore-ci.compose.yml
          CEH_ENV_FILE: /tmp/ceh-backup-ci.env
          CEH_CONFIRM_RESTORE: "YES"
        run: |
          set -Eeuo pipefail
          docker compose -f "$CEH_COMPOSE_FILE" exec -T db psql \
            -v ON_ERROR_STOP=1 -U ceh -d ceh_sklad \
            -c "DROP TABLE backup_probe;"
          ops/restore-postgres.sh "$CEH_CI_BACKUP_FILE"

      - name: Сверить восстановленные данные
        env:
          CEH_COMPOSE_FILE: ops/backup-restore-ci.compose.yml
        run: |
          set -Eeuo pipefail
          actual="$(docker compose -f "$CEH_COMPOSE_FILE" exec -T db psql \
            -At -v ON_ERROR_STOP=1 -U ceh -d ceh_sklad \
            -c "SELECT count(*) || '|' || sum(amount)::text || '|' || string_agg(label, ',' ORDER BY id) FROM backup_probe;")"
          if [[ "$actual" != "2|13.000|первая,вторая" ]]; then
            echo "Восстановленные данные не совпали: $actual" >&2
            exit 1
          fi

      - name: Удалить тестовые контейнеры backup/restore
        if: always()
        run: docker compose -f ops/backup-restore-ci.compose.yml down -v --remove-orphans
